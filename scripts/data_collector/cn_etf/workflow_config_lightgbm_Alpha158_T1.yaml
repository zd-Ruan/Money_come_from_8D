qlib_init:
    provider_uri: "data/cn_etf/qlib_data"
    region: cn

market: &market t1_etf
benchmark: &benchmark SH510300

data_handler_config: &data_handler_config
    start_time: 2015-01-01
    end_time: 2026-08-10
    fit_start_time: 2015-01-01
    fit_end_time: 2023-12-31
    instruments: *market
    # Signal at D close, buy at D+1 close, and sell no earlier than D+2.
    label: [["Ref($close, -2) / Ref($close, -1) - 1"], ["LABEL0"]]
    filter_pipe:
        - filter_type: ExpressionDFilter
          # Past-only rolling filter. The expression reconstructs close-based
          # traded value in CNY from Qlib-normalized price and volume.
          rule_expression: "Mean($close * $volume, 20) > 10000000"
          filter_start_time: null
          filter_end_time: null
          keep: false

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 20
            n_drop: 4
            hold_thresh: 1
            only_tradable: true
    backtest:
        start_time: 2025-01-01
        end_time: 2026-08-10
        account: 10000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            learning_rate: 0.05
            colsample_bytree: 0.8
            subsample: 0.8
            lambda_l1: 10
            lambda_l2: 20
            max_depth: 8
            num_leaves: 64
            num_threads: 12
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2015-01-01, 2023-12-31]
                valid: [2024-01-01, 2024-12-31]
                test: [2025-01-01, 2026-08-10]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              model: <MODEL>
              dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              ana_long_short: false
              ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
