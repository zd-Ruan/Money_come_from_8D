[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-quant-pipeline"
version = "0.1.0"
description = "Reliable ETF research pipeline built around Qlib"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "lightgbm",
  "numpy",
  "pandas",
  "plotly",
  "pyarrow",
  "pyyaml",
  "uvicorn",
]

[project.scripts]
quant-pipeline = "quant_pipeline.cli:main"
quant-pipeline-release = "quant_pipeline.release:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
