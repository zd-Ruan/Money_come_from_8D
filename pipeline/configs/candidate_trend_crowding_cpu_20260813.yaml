project:
  name: etf_alpha158_cpu_trend_crowding_20260813
  description: CPU candidate = Alpha158 + original trend_crowding family (including new 2026-08-13 factors)
  random_seeds: [20260812, 20260813, 20260814]

features:
  mode: alpha158_plus_original
  families: [trend_crowding]

paths:
  qlib_provider: data/cn_etf/qlib_data
  universe: data/cn_etf/trainable_universe_2015.csv
  instruments: data/cn_etf/qlib_data/instruments/t1_etf.txt
  validation_report: data/cn_etf/validation_trainable_2015.json
  runs: pipeline/runs
  snapshots: pipeline/snapshots
  registry: pipeline/registry.json

data:
  region: cn
  market: t1_etf
  benchmark: SH510300
  start_date: 2015-01-01
  end_date: 2026-08-11
  test_start_date: 2025-01-01
  label: Ref($close, -2) / Ref($close, -1) - 1
  label_horizon_bars: 2
  liquidity_expression: Mean($close * $volume, 20) > 10000000
  universe_mode: current_snapshot

rolling:
  train_mode: expanding
  validation_days: 126
  test_days: 63
  purge_bars: 2

model:
  name: lightgbm
  objective: regression
  learning_rate: 0.03
  num_leaves: 31
  max_depth: 7
  min_data_in_leaf: 100
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l1: 10.0
  lambda_l2: 20.0
  num_boost_round: 500
  early_stopping_rounds: 50
  num_threads: 12
  device_type: cpu
  gpu_platform_id: 0
  gpu_device_id: 0
  gpu_use_dp: true
  max_bin: 63
  verbosity: 1

strategy:
  topk: 5
  n_drop: 1
  hold_thresh: 5
  risk_degree: 0.9

execution:
  account: 20000
  deal_price: close
  commission_bps_per_side: 3
  base_slippage_bps_per_side: 5
  min_cost: 5
  trade_unit: 100
  stamp_tax_bps: 0
  limit_threshold: 0.1
  max_daily_volume_participation: 0.05
  stress_slippage_bps_per_side: [0, 5, 10, 15, 20, 30]

gates:
  min_test_days: 252
  min_prediction_coverage: 0.95
  min_fill_rate: 0.95
  max_zero_fill_order_rate: 0.05
  min_complete_folds: 4
  min_positive_fold_excess_ratio: 0.6
  min_hac_t_stat: 1.96
  min_rank_ic_hac_t_stat: 1.96
  max_strategy_drawdown: 0.25
  required_stress_slippage_bps: 10
  require_historical_point_in_time_universe_for_promotion: true

report:
  title: ETF Alpha158+trend_crowding CPU 候选
